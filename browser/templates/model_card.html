<article class="ch-browse-card" id="ch_${model_id}_card">
    <a class="ch-browse-preview" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="查看模型：${name}">${preview}</a>
    <div class="ch-browse-body">
        <strong class="ch-browse-title">${name}</strong>
        <div class="ch-browse-meta"><span>${type}</span><span>${base_models}</span></div>
        <details class="ch-browse-description"><summary>模型说明</summary><p>${description}</p></details>
        <div class="ch-browse-actions">
            <button type="button" onclick="ch_downloader(event, ${model_id})">选择版本与下载</button>
            <a href="${url}" target="_blank" rel="noopener noreferrer">模型网页</a>
        </div>
    </div>
</article>
